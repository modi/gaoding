[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaoding"
version = "0.0.2"
readme = "README.md"
requires-python = ">=3.8"
description = "搞定一些小事情"
license = {text = "Apache-2.0"}
authors = [
    {name = "Mo Di", email = "monore@foxmail.com"},
]
keywords = ["cli", "utilities", "env", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
# 开发环境工具：包含测试 + 代码质量工具
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
gaoding = "gaoding.cli:main"

[project.urls]
Homepage = "https://github.com/modi/gaoding"
Repository = "https://github.com/modi/gaoding"
Issues = "https://github.com/modi/gaoding/issues"

[tool.setuptools.packages.find]
include = ["gaoding*"]

[tool.setuptools]
# 根目录不打包任何代码，避免 setuptools 报错【未验证】
py-modules = []
